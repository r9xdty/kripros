<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- Loading screen, shown while the app downloads and starts. It matches
         src/screens/LoadingScreen.js and is faded out by src/lib/splash.web.js. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        justify-content: center;
        background: #dfe8e3;
        transition: opacity 0.3s ease;
      }
      #splash.done {
        opacity: 0;
        pointer-events: none;
      }
      #splash .screen {
        flex: 1;
        max-width: 480px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #047857;
        box-shadow: 0 0 24px rgba(15, 23, 42, 0.12);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: #fff;
      }
      #splash .logo {
        width: 88px;
        height: 88px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: breathe 1.6s ease-in-out infinite;
      }
      #splash .logo svg {
        width: 44px;
        height: 44px;
        fill: #fff;
      }
      #splash .name {
        margin-top: 16px;
        font-size: 28px;
        font-weight: 800;
      }
      #splash .bar {
        margin-top: 24px;
        width: 96px;
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.2);
        overflow: hidden;
      }
      #splash .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #fff;
        animation: slide 1.1s ease-in-out infinite;
      }
      #splash .note {
        margin: 24px 32px 0;
        font-size: 14px;
        text-align: center;
        color: #d1fae5;
      }
      @keyframes breathe {
        50% {
          transform: scale(1.06);
        }
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .logo,
        #splash .bar::after {
          animation: none;
        }
      }
    </style>
    <noscript>
      <style>
        #splash .bar {
          display: none;
        }
      </style>
    </noscript>
  </head>

  <body>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <div id="splash" role="progressbar" aria-label="Kripros yükleniyor">
      <div class="screen">
        <div class="logo">
          <!-- Ionicons "leaf" (MIT, https://ionic.io/ionicons) -->
          <svg viewBox="0 0 512 512" aria-hidden="true">
            <path
              d="M161.35 242a16 16 0 0122.62-.68c73.63 69.36 147.51 111.56 234.45 133.07 11.73-32 12.77-67.22 2.64-101.58-13.44-45.59-44.74-85.31-90.49-114.86-40.84-26.38-81.66-33.25-121.15-39.89-49.82-8.38-96.88-16.3-141.79-63.85-5-5.26-11.81-7.37-18.32-5.66-7.44 2-12.43 7.88-14.82 17.6-5.6 22.75-2 86.51 13.75 153.82 25.29 108.14 65.65 162.86 95.06 189.73 38 34.69 87.62 53.9 136.93 53.9a186 186 0 0027.77-2.04c41.71-6.32 76.43-27.27 96-57.75-89.49-23.28-165.94-67.55-242-139.16a16 16 0 01-.65-22.65zM467.43 384.19c-16.83-2.59-33.13-5.84-49-9.77a157.71 157.71 0 01-12.13 25.68c-.73 1.25-1.5 2.49-2.29 3.71a584.21 584.21 0 0058.56 12 16 16 0 104.87-31.62z"
            />
          </svg>
        </div>
        <div class="name">Kripros</div>
        <div class="bar"></div>
        <noscript><p class="note">Kripros’u kullanmak için tarayıcında JavaScript’i açman gerekiyor.</p></noscript>
      </div>
    </div>
  </body>
</html>
